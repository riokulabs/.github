target = "../../tools/se2publish"
kind = "tool"
repo = "se2publish"
name = "se2publish"
summary = "Steam Workshop publisher for Space Engineers 2 mods that include Scripts/, which the official Mod HUB does not upload. GPL-3.0."
keep = []
extra_labels = '''- name: steam-upload
  color: c5def5
  description: Staging, manifest or the Workshop upload path'''

test_script = "python3 -m pytest -q"

pr_checks = [
  "`scripts/test.sh` passes (pytest, offline: nothing talks to Steam or the SDK)",
  "Nothing in the change reads, stores, logs or asks for Steam credentials",
  "A real upload still needs `--i-have-user-approval` and the typed mod name; the dry run is still the default",
  "Config paths are still confined to the mod repo and read from git HEAD",
  "README \"When the game updates\" section updated if file formats or versions changed",
  "No tokens, game files or decompiled code are committed (`python3 scripts/check_repo_guard.py`)",
]

guard_forbidden = ["*.dll", "*.exe", "*.pdb", "*.so", ".env", "*.env", "*SeMcp2.cfg", "*.pem", "*.key", "*decompiled*"]
guard_allow = []
guard_max_kb = 512
guard_allow_large = []
guard_secret_skip = ["tests/test_stage_rules.py"]
json_globs = []
ruff_exclude = []

precommit_extra = '''  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # 38bfb07c0c64c304f47eb52090f8288150c77730
    hooks:
      - id: ruff'''

security_notes = [
  "The tool never asks for, reads or stores Steam credentials. A way to make it do so is a vulnerability.",
  "Path handling: anything that lets a config or mod repo make the tool read or upload files outside the mod repo.",
  "Anything that uploads without `--i-have-user-approval` and the typed confirmation.",
]

bug_form_note = "Do not paste Steam credentials, tokens or private paths. Nothing here needs them."
bug_output_note = "Paste the output, trimmed. Remove personal paths and anything that looks like a token"

contrib_build = '''Python 3.11+ and git. Nothing else to install; the tests do not need Steam, the game or the SDK.

```bash
scripts/test.sh              # python3 -m pytest -q
./se2publish.sh --help       # run from the checkout
```

A real upload needs the Steam client, the SE2 game, the Mod SDK and GE-Proton (see README). Do not run a real upload to test a change; use the dry run and the tests.'''

contrib_assets = '''## Security-sensitive behavior

This tool uploads to Steam Workshop on someone's behalf. Changes must keep these true: it never stores or asks for credentials, it never uploads unless `--i-have-user-approval` is passed and the mod name is typed, config paths stay inside the mod repo and are read from git HEAD, and `Scripts/` come from HEAD only (never untracked or modified files). A pull request that weakens one of these will not be merged.

It is an unofficial route around the official Mod HUB (see the README risk note). Do not add Keen code or assets here.'''

layout = '''- `se2publish/` the Python package (CLI in `cli.py`, staging, Steam upload, `changelog.py` for Workshop change notes, `bbcode.py`).
- `se2publish.sh` runs it from the checkout. `tests/` is pytest. `README.md`, `REPORT.md`.'''

build_test = '''```bash
python3 -m pytest -q          # all tests, offline
./se2publish.sh --help
```

A real upload needs `--i-have-user-approval` plus the typed mod name. Never run one unless the maintainer asked.'''

style = '''- Python 3.11+, standard library only (Pillow only for `thumb`). 4 spaces, 120 columns, type hints as in the neighbouring code.
- Fail loudly with a plain message. Safety checks (path confinement, manifest, dry run default) are not optional.'''

rules = '''- `CHANGELOG.md` of the mod being published is read by `se2publish/changelog.py`: headings look like `## [1.2.0] - 2026-10-20` (Keep a Changelog). Do not change the heading format without updating that parser and its tests (`tests/test_bbcode_changelog.py`).
- Re-verify against the installed game and SDK after any game update (README, "When the game updates").
- Test fixtures live in `tests/`; do not commit real Steam data.'''

extra_never = [
  "Never run a real upload, and never add code that stores, logs or requests Steam credentials.",
  "Never bundle `libsteam_api.so` or other Valve binaries.",
]

skill_build = '''- Dry run against a mod repo (shows every ISteamUGC call, uploads nothing): `./se2publish.sh --help` lists the commands. Only with the maintainer's explicit go-ahead does a run use `--i-have-user-approval`.'''

release_steps = '''   Check the README "Built for game ... and Mod SDK build ..." line still matches what you tested.'''
