target = "../../mods/DataCenter"
kind = "mod"
repo = "se2-data-center"
name = "Data Center"
summary = "Space Engineers 2 mod: server racks, rack-mount servers, cable trays and room pieces for data-center builds. GPL-3.0."

# Mod files that the sync must not touch: the LFS rules are specific to this repo.
keep = [".gitattributes", "CHANGELOG.md"]

extra_labels = '''- name: block-suggestion
  color: 1d76db
  description: A new block or a change to a block
- name: models
  color: c5def5
  description: Meshes, materials, damage models
- name: definitions
  color: c5def5
  description: Block definitions under Assets/
- name: scripts
  color: bfd4f2
  description: The optional C# layer (-loadScripts)
- name: platform:linux-native
  color: fef2c0
  description: Linux native via Pulsar + LinuxCompat
- name: platform:proton
  color: fef2c0
  description: Linux via Proton
- name: platform:windows
  color: fef2c0
  description: Windows'''

test_script = '''python3 -m pytest -q Tests -m "not build and not sdkbuild" "$@"'''

# CI plan: the offline pytest job stays informational (continue-on-error in templates/mod ci.yml) until se2-modkit
# installs from a release tag. On the modkit migration branch the suite imports se2modkit, and its pytest plugin runs
# the shared gates listed in pyproject.toml; the walk and schema gates and the tests needing the Mod SDK or the game's
# type facts skip on a runner. Once a tag exists: install the pinned se2-modkit in the job, drop continue-on-error, and
# refresh build_test, pr_checks, contrib_build and skill_build here from the mod's AGENTS.md (se2mod commands).

pr_checks = [
  "Offline tests pass: `scripts/test.sh` (same as `python3 -m pytest -q Tests -m \"not build\"` minus the SDK build)",
  "If a definition, model or script changed: the SDK build passes (`pgrep -x Modern.bin` prints nothing, then `python3 ../../tools/scripts/se2mod.py build DataCenter` exits 0 with no DataCenter warnings)",
  "Files under `Assets/` come from the generator (`Source/Model/`), not hand edits; GUIDs are untouched",
  "No preview renders, decompiled code, Keen DLLs, or tokens are committed (`python3 scripts/check_repo_guard.py`)",
  "Built from the main checkout, not a git worktree, and nothing was published",
  "`CHANGELOG.md` has a line under `[Unreleased]` for anything players will notice",
  "Any Keen asset reused is covered by the documented vanilla reuse; any new third-party content has a compatible license noted in the PR",
]

guard_forbidden = ["*.dll", "*.exe", "*.pdb", "*.blend", "*.blend1", "*/preview/*", "*/previews/*", "*decompiled*", "Content/*", ".env", "*.env", "*SeMcp2.cfg", "*.pem", "*.key", "*.mp4", "*.mov"]
guard_allow = ["docs/media/*"]
guard_max_kb = 2048
guard_allow_large = []
guard_secret_skip = ["*.def", "*.partialdef", "*.meta"]
json_globs = ["Assets/*.def", "Assets/*.partialdef", "Assets/*.meta", "Source/*.json", "*.vrgproj", "*.modhub-metadata"]
ruff_exclude = ["Assets", "Content"]

precommit_extra = '''  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # 38bfb07c0c64c304f47eb52090f8288150c77730
    hooks:
      - id: ruff'''

security_notes = [
  "A report about the mod's scripts (`Scripts/`) that could run code on another player's machine.",
  "Anything that leaks a token, path or private server detail through the mod or its logs.",
  "Not in scope: bugs in Space Engineers 2 itself, Pulsar or LinuxCompat. Report those to their projects.",
]

contrib_build = '''**Offline checks (anyone):** `scripts/test.sh` runs the pure-Python tests. Note that some test modules import `se2model`, a shared modeling library that currently lives in the maintainer's workspace (`../../tools/se2model`) and is not in this repository, so on a bare clone part of the suite cannot be collected yet.

**Full build (needs the maintainer's setup):**

- Blender 5.x (5.2 LTS is what the models are built with) with the VRAGE Tools add-on; the export step needs a GPU context, so it runs windowed.
- The Space Engineers 2 Mod SDK (Steam app 3578990). On Linux it runs under the GE-Proton build the SDK ships against.
- The pipeline is described in `docs/model-pipeline.md`: clone, build and export in Blender, stage, install, then the SDK build with `se2mod.py build`. `docs/testing-in-game.md` lists what to check in game.
- Run the SDK build from your main checkout, never from a git worktree, and never publish a build from a worktree.

If you cannot run the full build, open the pull request anyway with the generator change and say what you could not run.'''

contrib_assets = '''## Assets and licensing

- Do not add Keen Software House assets beyond the vanilla reuse this repository already documents (cloned vanilla definitions and kit parts for use in SE2 mods). If you are unsure whether something is covered, ask in the issue first.
- Do not add third-party models, textures, sounds or fonts unless the license is stated and compatible with GPL-3.0. Unlicensed content is rejected, including "found on the internet" images.
- Geometry in this mod is generated by the scripts in `Source/Model/`. Contribute the generator change, not a hand-edited FBX.
- This mod is non-commercial. Keen's EULA does not allow monetizing mods, so there is no donation or sponsor link.
- Preview renders are made on disk but are not committed. Marketing images for the README go in `docs/media/`.
- Do not commit decompiled game code, game DLLs, or anything from the game install.'''

layout = '''- `Assets/DataCenter/` game-format block definitions (`.def`, `.partialdef`, `.meta`), models, icons. Generated by the pipeline below and installed by `install.sh`; not hand-edited. Models are tracked with Git LFS (see `.gitattributes`).
- `Source/Model/` the Blender pipeline: `build_dc.py`, the `dc/` Python package (catalogue, cloning, damage, KVM, trays, integration), `integration/` (staging and `install.sh`).
- `Scripts/` optional C# layer (`Client/`, `Simulation/`), only loaded with the game flag `-loadScripts`.
- `Tests/` pytest suite, plus `CoreTests/` and `CompileCheck/` (C#).
- `docs/` contributor docs (`model-pipeline.md`, `testing-in-game.md`, `triangle-budgets.md`) and `workshop/` (Workshop text and thumbnail).
- `Content/`, `.hashescache*`, `.referencescache*` are build output and ignored.'''

build_test = '''```bash
python3 -m pytest -q Tests -m "not build and not sdkbuild"                  # offline tests
blender -b --python Source/Model/build_dc.py -- all --no-render             # models (needs Blender 5.x)
python3 Source/Model/build_integration.py && bash Source/Model/integration/install.sh        # stage, then dry-run install
pgrep -x Modern.bin; python3 ../../tools/scripts/se2mod.py build DataCenter  # SDK build (game closed)
```

Pytest markers: `build` needs a prior Blender build, `sdkbuild` runs the real SDK build (opt-in with `DC_SDK_BUILD=1`), `scripts` needs `Scripts/`. Some tests import `se2model` from `../../tools`, which exists only in the maintainer's workspace; on a bare clone those modules fail to collect.'''

style = '''- Python 3.11+, 4-space indent, 120 columns, standard library plus Blender's `bpy` where needed. Follow the neighboring file.
- Comments say why, not what. Docs and messages in plain language; no marketing words.
- C# in `Scripts/` follows the game's script API; keep it small and read-only where possible.
- Every modeled part must have a believable purpose in the real thing and fit the block.'''

rules = '''- Edit generators in `Source/Model/dc/`, rerun the pipeline, commit the regenerated `Assets/` together with the generator change.
- Never hand-edit GUIDs or `.meta` files. `.clonemap.json` and `asset_guids.json` are keyed state; do not rewrite them by hand.
- Blocks behave like the vanilla block they are cloned from; deviations are documented in `README.md`.
- Preview renders (`Source/Model/preview/`) stay on disk and are never committed. README images go in `docs/media/`.
- Vanilla reuse: cloned vanilla definitions and kit parts are fine in SE2 mods; nothing else from Keen.'''

extra_never = [
  "Never publish from a git worktree, and never run `se2mod.py build` with the game or Editor open.",
  "Never commit preview renders, `Content/`, or Blender files.",
]

skill_build = '''- Models: `blender -b --python Source/Model/build_dc.py -- all --no-render` (Blender 5.x).
- Stage and install: `python3 Source/Model/build_integration.py`, then `bash Source/Model/integration/install.sh` (dry run; `--apply` only when asked).
- SDK build: `pgrep -x Modern.bin` must print nothing, then `python3 ../../tools/scripts/se2mod.py build DataCenter`. Main checkout only, never a worktree.'''

release_steps = '''   Also update `docs/workshop/` text and the version in `ModProject.modhub-metadata` if it carries one, and run the SDK build from the main checkout. The maintainer publishes to the Workshop with the publish tool; do not publish.'''
